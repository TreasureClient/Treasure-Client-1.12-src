name: Deploy WASM client to GitHub Pages

on:
  # Every push to WASM republishes the beta. Push JS first so its newest build is picked up.
  push:
    branches: [ WASM ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site (beta builds)
        run: |
          set -eu
          mkdir -p _site
          # WASM build at the site root (and wasm.html)
          cp wasm_gc_teavm/javascript_dist/Treasure-Client_WASM.html _site/index.html
          cp _site/index.html _site/wasm.html
          if [ -f wasm_gc_teavm/javascript_dist/favicon.png ]; then
            cp wasm_gc_teavm/javascript_dist/favicon.png _site/favicon.png
          fi
          # JS build from the JS branch
          git fetch --depth=1 origin JS
          git show FETCH_HEAD:javascript/Eaglercraft_1.12_Offline_en_US.html > _site/js.html
          # Version shown on treasureclient.github.io (from the main menu title)
          VERSION=$(sed -n 's/.*brandTitle = "Treasure Client \([^"]*\)".*/\1/p' src/game/java/net/minecraft/client/gui/GuiMainMenu.java | head -n 1)
          printf '{"version":"%s","commit":"%s","date":"%s"}\n' "${VERSION:-Beta}" "$(git rev-parse --short HEAD)" "$(date -u +%Y-%m-%d)" > _site/version.json
          # disable Jekyll so files are served verbatim
          touch _site/.nojekyll
          echo "Assembled _site:"; ls -la _site; cat _site/version.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
