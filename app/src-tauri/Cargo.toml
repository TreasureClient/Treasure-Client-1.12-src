[package]
name = "treasure-launcher"
version = "0.1.0"
edition = "2021"
description = "Treasure Launcher: Minecraft with Treasure Client, Modrinth and instances"

# its own workspace: the window needs system libraries (WebKitGTK on Linux), so it's only built
# by GitHub Actions, while the engine (../../core) builds anywhere
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
treasure-core = { path = "../../core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
