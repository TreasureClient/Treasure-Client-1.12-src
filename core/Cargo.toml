[package]
name = "treasure-core"
version = "0.1.0"
edition = "2021"
description = "Treasure Launcher's engine: installs Minecraft, Java, Fabric and Modrinth content and starts the game"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1_smol = "1"
ureq = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
