name: TreasureViaServer
version: 0.2
main: com.treasureclient.via.TreasureViaServer
author: Treasure Client
description: >
  Option A data source (server side). Detects Treasure Clients via the
  TC|ViaBlocks handshake and streams modern blocks to them over that channel
  (the client applies them from its ViaBlocks registry).
# 1.12 uses legacy plugin-channel names, so no api-version line here.
commands:
  viablock:
    description: Place the modern block you're looking at (Treasure Client only).
    usage: /viablock <name>
    permission: treasurevia.use
  viablocks:
    description: List the available modern block names.
  viatest:
    description: Send a sampler of modern blocks to your client.
    permission: treasurevia.use
permissions:
  treasurevia.use:
    description: Use the ViaBlocks placement commands.
    default: op
